html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{position:relative;margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg1);background-image:radial-gradient(ellipse at 90% 0%,rgba(255,255,255,.5),transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));font:600 21px/1.4 "Cormorant Garamond",Georgia,"Times New Roman",serif}
.fl{position:absolute;width:clamp(150px,44vw,270px);height:auto;pointer-events:none;z-index:0}
.tl{top:0;left:0}.br{bottom:0;right:0;transform:rotate(180deg)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:clamp(170px,47vw,290px) 18px clamp(150px,44vw,270px)}
header{text-align:center}
h1{font-weight:700;font-style:italic;font-size:clamp(2rem,8.5vw,2.9rem);line-height:1.1;margin:0;color:var(--title)}
.rule{width:min(300px,70%);height:2px;background:var(--line);margin:16px auto 6px}
.novios{color:var(--title)}
.sc{display:block;font:400 clamp(2.6rem,12vw,4rem)/1.15 "Pinyon Script","Snell Roundhand","Apple Chancery",Georgia,serif}
.dt{display:block;font-weight:700;letter-spacing:.14em;font-size:1.3rem;margin-top:2px}
.dv{display:flex;align-items:center;gap:12px;margin:14px 0 4px;color:var(--line)}
.dv i{flex:1;height:2px;background:var(--line)}.dv svg{width:44px;height:18px}
.box{position:relative;margin-top:18px}
input{width:100%;font:inherit;font-size:1.5rem;font-weight:600;padding:16px 62px 16px 20px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--muted);font-style:italic}
input:focus{border-color:#8a6bc2;box-shadow:0 0 0 3px var(--lilac-b)}
input::-webkit-search-cancel-button{display:none}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:12px;background:var(--lilac);color:var(--title);font:700 1.8rem/1 Georgia,serif;cursor:pointer;display:none}
#clear:focus-visible{outline:3px solid var(--lilac-b);outline-offset:2px}
#status{margin:18px 4px 12px;color:var(--muted);font-size:1.25rem;font-style:italic;min-height:1.4em;text-align:center}
.card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.name{font-weight:700;font-size:1.65rem;line-height:1.15;overflow-wrap:anywhere}
.mesa{flex:none;min-width:96px;text-align:center;background:var(--lilac);border:1px solid var(--lilac-b);border-radius:14px;padding:8px 10px;color:var(--title)}
.mesa small{display:block;font-size:.85rem;letter-spacing:.24em;font-weight:700}
.mesa b{display:block;font-size:3.5rem;line-height:1;font-weight:700;font-variant-numeric:lining-nums}
.empty{text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:24px 20px;font-size:1.4rem;font-weight:700}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:1.15rem;font-style:italic}

const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const DB=GUESTS.map(([name,mesa])=>{const n=norm(name);return{name,mesa,n,words:n.split(" ")}});

function lev(a,b){
  if(a===b)return 0;
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const c=[i];
    for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c;
  }
  return p[b.length];
}
const maxDist=t=>t.length<3?0:t.length<=5?1:2;

function search(q){
  const toks=norm(q).split(" ").filter(Boolean);
  if(norm(q).length<2)return{type:"short"};
  const exact=[];
  for(const g of DB){
    if(toks.every(t=>g.n.includes(t))){
      const s=toks.reduce((a,t)=>a+(g.words.some(w=>w.startsWith(t))?1:0),0);
      exact.push({g,s});
    }
  }
  if(exact.length){
    exact.sort((a,b)=>b.s-a.s||a.g.name.localeCompare(b.g.name,"es"));
    return{type:"exact",list:exact.map(x=>x.g)};
  }
  const fuzzy=[];
  for(const g of DB){
    let total=0,ok=true;
    for(const t of toks){
      const m=maxDist(t);let best=99;
      for(const w of g.words){
        const d=Math.min(lev(t,w),w.length>t.length?lev(t,w.slice(0,t.length)):99);
        if(d<best)best=d;
      }
      if(best>m){ok=false;break}
      total+=best;
    }
    if(ok)fuzzy.push({g,total});
  }
  fuzzy.sort((a,b)=>a.total-b.total||a.g.name.localeCompare(b.g.name,"es"));
  return fuzzy.length?{type:"fuzzy",list:fuzzy.slice(0,8).map(x=>x.g)}:{type:"none"};
}

const $=id=>document.getElementById(id),q=$("q"),res=$("results"),st=$("status"),clr=$("clear");
function card(g){
  const c=document.createElement("div");c.className="card";
  const n=document.createElement("div");n.className="name";n.textContent=g.name;
  const m=document.createElement("div");m.className="mesa";
  const s=document.createElement("small");s.textContent="MESA";
  const b=document.createElement("b");b.textContent=g.mesa;
  m.append(s,b);c.append(n,m);return c;
}
function render(){
  const v=q.value;clr.style.display=v?"block":"none";
  res.textContent="";
  const r=search(v);
  if(r.type==="short"){st.textContent=v.trim()?"Escribe al menos 2 letras…":"Escribe tu nombre o apellido para ver tu mesa.";return}
  if(r.type==="none"){
    st.textContent="";
    const e=document.createElement("div");e.className="empty";
    e.textContent="No encontramos tu nombre, prueba con tu apellido o consulta con los novios.";
    res.append(e);return;
  }
  if(r.type==="fuzzy"){st.textContent="No hay coincidencias exactas. ¿Quisiste decir…?"}
  else st.textContent=r.list.length===1?"Encontramos 1 resultado":"Encontramos "+r.list.length+" resultados: elige el tuyo";
  r.list.forEach(g=>res.append(card(g)));
}
q.addEventListener("input",render);
q.addEventListener("keydown",e=>{if(e.key==="Enter")q.blur()});
clr.addEventListener("click",()=>{q.value="";render();q.focus()});
render();
window.addEventListener("load",()=>q.focus());
</script>
